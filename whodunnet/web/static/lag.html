<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lagging now</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; }
  button { font-size: 1.6rem; padding: 2.2rem 2.6rem; border-radius: 50%; border: 0;
           background: #d33; color: #fff; width: 15rem; height: 15rem; }
  p { min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <button id="lag">It's lagging now</button>
  <p id="done"></p>
</main>
<script>
document.getElementById("lag").onclick = async () => {
  const done = document.getElementById("done");
  try {
    const r = await fetch("/api/lag", {method: "POST", credentials: "same-origin",
      headers: {"X-Whodunnet": "1", "Content-Type": "application/json"}, body: "{}"});
    done.textContent = r.ok ? "Recorded ✓ — thanks!" : "This link is invalid";
  } catch (e) {
    done.textContent = "Couldn't reach the Mac — is it awake and on the same WiFi?";
  }
};
</script>
</body>
</html>
